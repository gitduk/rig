name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp target/release/rig dist/rig-x86_64-unknown-linux-gnu
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
