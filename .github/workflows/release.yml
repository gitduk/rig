name: release

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Branch pushes: tag Cargo.toml's version if the tag is missing, then let
  # build publish in the same run. Manual `git tag && git push origin <tag>`
  # keeps working — tag pushes skip this job and go straight to build.
  # Auto-tags can't rely on the tag push triggering a second run: pushes made
  # with GITHUB_TOKEN don't create new workflow runs.
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Tag Cargo.toml version if missing
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists, skipping"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: github.ref_type == 'tag' || needs.tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp target/release/rig dist/rig-x86_64-unknown-linux-gnu
          cp rig.zsh dist/rig.zsh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || needs.tag.outputs.tag }}
          files: dist/*
