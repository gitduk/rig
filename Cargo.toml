[package]
name = "rig"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = "4.6.8"
flate2 = "1.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }
toml = "1.1.4"
ureq = "3.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
