[package]
name = "rig"
version = "1.0.5"
repository = "https://github.com/gitduk/rig"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "string"] }
clap_complete = "4.6.8"
flate2 = "1.1.9"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }
toml = "1.1.4"
ureq = "3.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Ship only GitHub Releases, never crates.io
[package.metadata.release]
publish = false
